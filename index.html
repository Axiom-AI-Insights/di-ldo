<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.I. LDO — Access Required</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Special+Elite&display=swap');

  :root {
    --blood: #8B0000;
    --gold: #D4AF37;
    --dark: #1a1a2e;
    --darker: #0f0f1a;
    --cream: #f5f0e8;
    --pink: #ff69b4;
    --teal: #2dd4bf;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--darker);
    color: var(--cream);
    line-height: 1.6;
  }

  /* PASSWORD GATE */
  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }

  .gate-inner { max-width: 440px; }

  .gate h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    color: var(--blood);
    letter-spacing: 6px;
    margin-bottom: 4px;
  }

  .gate .subtitle {
    font-family: 'Special Elite', cursive;
    color: var(--gold);
    font-size: 0.85rem;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .gate .tagline {
    font-style: italic;
    color: var(--gold);
    font-size: 0.8rem;
    margin-bottom: 40px;
    opacity: 0.8;
  }

  .gate p { color: var(--cream); opacity: 0.7; margin-bottom: 20px; font-size: 0.95rem; }

  .gate input {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 14px 20px;
    width: 100%;
    background: var(--dark);
    border: 2px solid var(--blood);
    color: var(--cream);
    border-radius: 8px;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.3s;
  }

  .gate input:focus { border-color: var(--gold); }
  .gate input::placeholder { color: var(--cream); opacity: 0.3; }

  .gate button {
    font-family: 'Special Elite', cursive;
    font-size: 1rem;
    padding: 14px 40px;
    background: var(--blood);
    color: var(--cream);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.3s;
    width: 100%;
  }

  .gate button:hover { background: #a00000; }
  .error { color: #ff4444; font-size: 0.85rem; margin-top: 12px; display: none; }
  .divider { width: 60px; height: 2px; background: var(--blood); margin: 0 auto 30px; }

  /* MAIN CONTENT */
  .content { display: none; }
  .content.active { display: block; }

  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    background: linear-gradient(180deg, rgba(139,0,0,0.15) 0%, transparent 100%);
    border-bottom: 1px solid rgba(139,0,0,0.3);
  }

  .hero-icon { font-size: 64px; margin-bottom: 16px; display: block; }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 6vw, 48px);
    color: var(--blood);
    margin-bottom: 8px;
    line-height: 1.1;
  }

  .hero .subtitle {
    font-family: 'Special Elite', cursive;
    color: var(--gold);
    font-size: clamp(14px, 3vw, 20px);
    margin-bottom: 8px;
  }

  .hero .tagline {
    font-style: italic;
    color: rgba(245,240,232,0.5);
    font-size: clamp(12px, 2.5vw, 14px);
    max-width: 500px;
    margin: 0 auto;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* SECTION HEADERS */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 48px 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(212,175,55,0.3);
  }

  .section-header .icon { font-size: 28px; flex-shrink: 0; }

  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 32px);
    color: var(--gold);
    margin: 0;
  }

  h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--blood);
    margin: 28px 0 12px;
  }

  p { margin-bottom: 12px; font-size: 15px; }

  /* CLASSIFIED BANNER */
  .classified {
    background: linear-gradient(135deg, var(--blood), #5a0000);
    color: var(--cream);
    text-align: center;
    padding: 12px 20px;
    font-family: 'Special Elite', cursive;
    letter-spacing: 4px;
    font-size: 13px;
    text-transform: uppercase;
  }

  /* BOXES */
  .warning-box {
    background: rgba(139,0,0,0.15);
    border: 1px solid var(--blood);
    border-radius: 12px;
    padding: 20px 24px;
    margin: 20px 0;
    font-size: 14px;
  }

  .warning-box strong { color: var(--blood); }

  .info-box {
    background: rgba(212,175,55,0.08);
    border-left: 4px solid var(--gold);
    border-radius: 0 12px 12px 0;
    padding: 20px 24px;
    margin: 20px 0;
    font-size: 14px;
  }

  .teal-box {
    background: rgba(45,212,191,0.08);
    border-left: 4px solid var(--teal);
    border-radius: 0 12px 12px 0;
    padding: 20px 24px;
    margin: 20px 0;
    font-size: 14px;
  }

  /* CONTENTS BOX */
  .contents-box {
    background: var(--dark);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 12px;
    padding: 24px 28px;
    margin: 24px 0;
  }

  .contents-box h3 {
    font-family: 'Special Elite', cursive;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 2px;
    margin: 0 0 16px;
    text-transform: uppercase;
  }

  .contents-box ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .contents-box li {
    padding: 8px 0;
    border-bottom: 1px solid rgba(245,240,232,0.06);
    font-size: 14px;
    color: rgba(245,240,232,0.8);
  }

  .contents-box li:last-child { border-bottom: none; }
  .contents-box li span.toc-icon { margin-right: 10px; }

  /* CHARACTER CARD */
  .char-card {
    background: linear-gradient(135deg, var(--dark), rgba(26,26,46,0.9));
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 16px;
    padding: 32px;
    margin: 24px 0;
    position: relative;
    overflow: hidden;
  }

  .char-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: var(--gold);
  }

  .char-card .char-icon { font-size: 48px; text-align: center; margin-bottom: 16px; display: block; }

  .char-card .char-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 5vw, 32px);
    color: var(--gold);
    text-align: center;
    margin-bottom: 4px;
  }

  .char-card .char-archetype {
    font-family: 'Special Elite', cursive;
    color: var(--pink);
    font-size: 13px;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .char-card .badge {
    display: inline-block;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: rgba(212,175,55,0.15);
    color: var(--gold);
    border: 1px solid var(--gold);
  }

  .char-section { margin: 20px 0; }

  .char-section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--teal);
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .char-section-label .label-icon { font-size: 14px; }
  .char-section p { font-size: 14px; color: rgba(245,240,232,0.85); line-height: 1.7; }

  /* VICTIM PROFILE */
  .victim-card {
    background: linear-gradient(135deg, rgba(139,0,0,0.2), rgba(26,26,46,0.9));
    border: 1px solid var(--blood);
    border-radius: 16px;
    padding: 32px;
    margin: 24px 0;
    position: relative;
    overflow: hidden;
  }

  .victim-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: var(--blood);
  }

  .victim-card .char-icon { font-size: 48px; text-align: center; margin-bottom: 12px; display: block; }
  .victim-card .char-name {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--blood);
    text-align: center;
    margin-bottom: 4px;
  }

  .victim-card .victim-tag { text-align: center; margin-bottom: 16px; }

  .victim-card .badge {
    display: inline-block;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: var(--blood);
    color: white;
  }

  /* CAST TABLE */
  .cast-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 14px;
  }

  .cast-table th {
    background: var(--dark);
    color: var(--gold);
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-bottom: 2px solid var(--blood);
  }

  .cast-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(245,240,232,0.08);
    vertical-align: top;
  }

  .cast-table .char-emoji { font-size: 20px; text-align: center; }
  .cast-table tr:hover { background: rgba(139,0,0,0.05); }

  /* SECRET BOX */
  .secret-box {
    background: linear-gradient(135deg, rgba(139,0,0,0.15), rgba(0,0,0,0.3));
    border: 2px solid var(--blood);
    border-radius: 16px;
    padding: 28px;
    margin: 24px 0;
  }

  .secret-box::before {
    content: '🔒 CLASSIFIED';
    display: block;
    font-family: 'Special Elite', cursive;
    color: var(--blood);
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 12px;
  }

  .secret-box p { font-size: 14px; line-height: 1.8; }

  /* DO / DON'T BOXES */
  .do-box {
    background: rgba(45,212,191,0.08);
    border: 1px solid var(--teal);
    border-radius: 12px;
    padding: 20px 24px;
    margin: 12px 0;
  }

  .do-box::before {
    content: '✅ WHAT YOU CAN REVEAL';
    display: block;
    font-family: 'Special Elite', cursive;
    color: var(--teal);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .dont-box {
    background: rgba(255,105,180,0.08);
    border: 1px solid var(--pink);
    border-radius: 12px;
    padding: 20px 24px;
    margin: 12px 0;
  }

  .dont-box::before {
    content: '🚫 WHAT YOU MUST NEVER REVEAL';
    display: block;
    font-family: 'Special Elite', cursive;
    color: var(--pink);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .do-box p, .dont-box p { font-size: 14px; line-height: 1.7; }

  /* KEY POINTS BOX */
  .key-points {
    background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(26,26,46,0.95));
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 28px;
    margin: 28px 0;
  }

  .key-points::before {
    content: '⚡ KEY POINTS TO REMEMBER';
    display: block;
    font-family: 'Special Elite', cursive;
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .key-points ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .key-points li {
    padding: 10px 0;
    border-bottom: 1px solid rgba(212,175,55,0.15);
    font-size: 14px;
    line-height: 1.6;
    color: var(--cream);
    padding-left: 24px;
    position: relative;
  }

  .key-points li:last-child { border-bottom: none; }

  .key-points li::before {
    content: '▸';
    color: var(--gold);
    position: absolute;
    left: 4px;
    font-weight: 700;
  }

  .key-points li strong { color: var(--gold); }

  /* SCRIPT BLOCKS */
  .script-block {
    background: rgba(0,0,0,0.4);
    border-left: 3px solid var(--pink);
    padding: 20px 24px;
    margin: 16px 0;
    font-style: italic;
    font-size: 14px;
    line-height: 1.9;
    border-radius: 0 12px 12px 0;
  }

  /* YEARBOOK STRIP */
  .yearbook {
    background: var(--dark);
    border-radius: 12px;
    padding: 24px;
    margin: 20px 0;
    text-align: center;
    border: 1px dashed rgba(212,175,55,0.3);
  }

  .yearbook .year {
    font-family: 'Special Elite', cursive;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .yearbook .quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--cream);
    font-size: 18px;
    opacity: 0.8;
  }

  .yearbook .attrib {
    font-size: 12px;
    color: rgba(245,240,232,0.4);
    margin-top: 8px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 40px 20px;
    border-top: 1px solid rgba(139,0,0,0.2);
    margin-top: 40px;
  }

  .footer p {
    font-family: 'Special Elite', cursive;
    color: var(--blood);
    font-size: 14px;
    letter-spacing: 2px;
  }

  .footer .gold { color: var(--gold); font-style: italic; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .container { padding: 0 16px 40px; }
    .char-card, .victim-card, .secret-box, .key-points { padding: 20px; }
    .cast-table { font-size: 12px; }
    .cast-table td, .cast-table th { padding: 8px 10px; }
  }

  /* PRINT STYLES */
  @media print {
    body { background: white; color: #1a1a1a; }
    .gate { display: none !important; }
    .content { display: block !important; }
    .classified { background: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .hero { background: none; border-bottom: 2px solid #333; padding: 30px 0; }
    .hero h1 { color: #333; }
    .hero .subtitle { color: #666; }
    .container { max-width: 100%; padding: 0; }
    .section-header { border-bottom: 1px solid #ccc; }
    .section-header h2 { color: #333; }
    .char-card, .victim-card, .secret-box, .key-points,
    .warning-box, .info-box, .teal-box, .do-box, .dont-box, .contents-box {
      break-inside: avoid;
      border-color: #999;
      background: #f5f5f5 !important;
    }
    .char-card .char-name, .victim-card .char-name { color: #333; }
    .char-section-label { color: #555; }
    .char-section p, .secret-box p, .key-points li,
    .do-box p, .dont-box p, p { color: #1a1a1a; }
    .cast-table th { background: #ddd; color: #333; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cast-table td { border-bottom: 1px solid #ddd; }
    .yearbook { background: #f0f0f0 !important; border-color: #ccc; }
    .yearbook .quote { color: #333; }
    .footer p { color: #666; }
    .footer .gold { color: #333; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>

</div>

function unlock() {
  const pw = document.getElementById('pw').value;
  const encoded = DATA[pw];
  if (encoded) {
    const raw = atob(encoded);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const decoded = new TextDecoder('utf-8').decode(bytes);
    document.getElementById('gate').style.display = 'none';
    const content = document.getElementById('playerContent');
    content.innerHTML = decoded;
    content.classList.add('active');
    window.scrollTo(0, 0);
  } else {
    const err = document.getElementById('err');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});
</script>
